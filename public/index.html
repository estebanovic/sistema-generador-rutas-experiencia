<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Generador de Rutas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; display: flex; height: 100vh; }

    #sidebar {
      width: 340px; min-width: 340px;
      padding: 16px;
      background: #1a1a2e;
      color: #eee;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    h1 { font-size: 1rem; color: #e94560; letter-spacing: 1px; }
    .section-title { font-size: 0.72rem; color: #e94560; letter-spacing: 1px;
      text-transform: uppercase; font-weight: bold; }

    label { font-size: 0.72rem; color: #aaa; display: block; margin-bottom: 4px; }

    .coord-group { display: flex; gap: 8px; }
    .coord-group input { width: 50%; }

    input[type="number"], select {
      width: 100%; padding: 7px 10px;
      background: #16213e; border: 1px solid #333;
      border-radius: 6px; color: #eee; font-size: 0.83rem;
    }

    .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .profile-btn {
      padding: 9px; border: 2px solid #333; border-radius: 8px;
      background: #16213e; color: #aaa; cursor: pointer;
      font-size: 0.78rem; text-align: center; transition: all 0.2s;
    }
    .profile-btn:hover { border-color: #e94560; color: #fff; }
    .profile-btn.active { border-color: #e94560; background: #e94560; color: #fff; }

    .opt-grid { display: grid; gap: 6px; }
    .opt-grid.opt3 { grid-template-columns: repeat(3, 1fr); }
    .opt-grid.opt2 { grid-template-columns: repeat(2, 1fr); }
    .opt-btn {
      padding: 8px 4px; border: 2px solid #333; border-radius: 8px;
      background: #16213e; color: #aaa; cursor: pointer;
      font-size: 0.72rem; text-align: center; transition: all 0.2s;
    }
    .opt-btn:hover { border-color: #e94560; color: #fff; }
    .opt-btn.active { border-color: #e94560; background: #e94560; color: #fff; }

    input[type="range"] { width: 100%; accent-color: #e94560; }

    button.action {
      padding: 11px; background: #e94560; color: white;
      border: none; border-radius: 8px; cursor: pointer;
      font-size: 0.92rem; font-weight: bold; transition: background 0.2s;
    }
    button.action:hover { background: #c73652; }
    button.action:disabled { background: #555; cursor: not-allowed; }
    button.ghost {
      padding: 9px; background: #16213e; color: #eee;
      border: 2px solid #0f3460; border-radius: 8px; cursor: pointer;
      font-size: 0.82rem; font-weight: 600; transition: all 0.2s;
    }
    button.ghost:hover { border-color: #00b4d8; color: #fff; }
    button.ghost:disabled { opacity: .5; cursor: not-allowed; }

    .import-status { font-size: 0.72rem; color: #aaa; min-height: 14px; }

    #stats { display: none; flex-direction: column; gap: 10px; }
    .profile-result {
      background: #16213e; border-radius: 8px; padding: 12px;
      border-left: 4px solid #555; font-size: 0.78rem;
    }
    .profile-result .pr-title { font-weight: bold; margin-bottom: 8px; font-size: 0.85rem; }
    .stat-row {
      display: flex; justify-content: space-between;
      padding: 3px 0; border-bottom: 1px solid #2a2a4a;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { color: #aaa; }
    .stat-value { font-weight: bold; }

    .bars-title { color: #aaa; font-size: 0.7rem; margin: 8px 0 4px; }
    .breakdown-bar {
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 3px; font-size: 0.72rem;
    }
    .bar-label { width: 75px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { flex: 1; height: 7px; background: #2a2a4a; border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; }
    .bar-pct { width: 30px; text-align: right; color: #eee; }

    #error { color: #e94560; font-size: 0.78rem; display: none;
      background: #2a1620; padding: 8px 10px; border-radius: 6px; }
    #map { flex: 1; }
    .hint { font-size: 0.7rem; color: #555; }
    hr { border: none; border-top: 1px solid #2a2a4a; }
  </style>
</head>
<body>
<div id="sidebar">
  <h1>GENERADOR DE RUTAS</h1>

  <!-- Importar -->
  <div>
    <div class="section-title">1 · Zona</div>
    <p class="hint" style="margin:4px 0 8px">Encuadrá una zona chica y descargá sus calles.</p>
    <button id="importar" class="ghost">Importar área visible</button>
    <div class="import-status" id="importStatus"></div>
  </div>

  <hr />
  <div class="section-title">2 · Ruta</div>

  <div>
    <label>Origen (lat, lon)</label>
    <div class="coord-group">
      <input type="number" id="originLat" value="-33.433" step="0.001" />
      <input type="number" id="originLon" value="-70.653" step="0.001" />
    </div>
  </div>

  <div>
    <label>Destino (lat, lon)</label>
    <div class="coord-group">
      <input type="number" id="destLat" value="-33.422" step="0.001" />
      <input type="number" id="destLon" value="-70.642" step="0.001" />
    </div>
  </div>

  <div>
    <label>Perfil base</label>
    <div class="profile-grid">
      <div class="profile-btn active" data-profile="moto-curvas">Moto curvas</div>
      <div class="profile-btn" data-profile="4x4">4x4</div>
    </div>
  </div>

  <!-- Parámetros (siempre visibles) -->
  <div id="weights">
    <label style="color:#e94560; font-weight:bold;">Parámetros</label>

    <!-- Pesos manejados por preset/botones: inputs ocultos = fuente de verdad -->
    <input type="hidden" data-weight="distanceWeight" value="0.05" />
    <input type="hidden" data-weight="surfaceWeight" value="0" />
    <input type="hidden" data-weight="elevationWeight" value="0" />

    <div style="margin-top:6px;">
      <label>Sinuosidad <span id="val-curviness">1</span></label>
      <input type="range" min="0" max="1" step="0.05" value="1" data-weight="curvinessWeight" />
    </div>

    <div style="margin-top:10px;">
      <label>Tipo de camino</label>
      <div class="opt-grid opt3" data-target="surfaceWeight">
        <div class="opt-btn" data-value="1">Pavimento</div>
        <div class="opt-btn" data-value="0">Mixto</div>
        <div class="opt-btn" data-value="-0.7">Rural</div>
      </div>
    </div>

    <div style="margin-top:10px;">
      <label>Desnivel</label>
      <div class="opt-grid opt3" data-target="elevationWeight">
        <div class="opt-btn" data-value="-0.7">Montañoso</div>
        <div class="opt-btn" data-value="0">Indiferente</div>
        <div class="opt-btn" data-value="1">Lo más plano</div>
      </div>
    </div>
  </div>

  <div>
    <label>Recorrido</label>
    <div class="opt-grid opt3" id="tripGroup">
      <div class="opt-btn active" data-trip="direct">Directo</div>
      <div class="opt-btn" data-trip="medium">Medio</div>
      <div class="opt-btn" data-trip="long">Largo</div>
    </div>
  </div>

  <button id="calcular" class="action">Calcular ruta</button>
  <div id="error"></div>

  <div id="stats"></div>

  <p class="hint">Click en el mapa: primero origen (verde), luego destino (rojo).</p>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const API = location.origin; // misma app Nest

  const PROFILES_META = {
    'moto-curvas':{ label: 'Moto curvas', color: '#00b4d8', weight: 5 },
    '4x4':        { label: '4x4',         color: '#e94560', weight: 4 },
  };

  // Valores predefinidos por perfil (deben coincidir con el backend).
  const PRESETS = {
    'moto-curvas': { distanceWeight: 0.05, curvinessWeight: 1.0, elevationWeight: 0.0, surfaceWeight: 0.0 },
    '4x4':         { distanceWeight: 0.6,  curvinessWeight: 0.15, elevationWeight: 0.0, surfaceWeight: -0.7 },
  };
  // Único peso con valor numérico a la vista (los demás van por botones).
  const VAL_SPANS = { curvinessWeight: 'val-curviness' };
  let selectedTrip = 'direct';

  const HIGHWAY_COLORS = {
    motorway:'#f44336', trunk:'#ff5722', primary:'#ff9800',
    secondary:'#ffc107', tertiary:'#ffeb3b', unclassified:'#8bc34a',
    residential:'#4caf50', track:'#795548', path:'#9c27b0', service:'#607d8b',
  };
  const SURFACE_COLORS = {
    asphalt:'#607d8b', concrete:'#78909c', gravel:'#ff8f00',
    dirt:'#6d4c41', sand:'#fdd835', cobblestone:'#9e9e9e', unknown:'#546e7a',
  };

  const map = L.map('map').setView([-33.428, -70.648], 14); // Santiago
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
  }).addTo(map);

  let routeLayers = [];
  let markers = [];
  let clickPoints = [];
  let bboxLayer = null;
  let selectedProfile = 'moto-curvas'; // null = personalizado (sliders editados)

  const $ = (id) => document.getElementById(id);

  // ---- Click en mapa: origen / destino ----
  map.on('click', (e) => {
    if (clickPoints.length >= 2) {
      clickPoints = [];
      markers.forEach(m => map.removeLayer(m));
      markers = [];
    }
    clickPoints.push(e.latlng);
    const isOrigin = clickPoints.length === 1;
    const marker = L.circleMarker(e.latlng, {
      radius: 8,
      color: isOrigin ? '#4caf50' : '#e94560',
      fillColor: isOrigin ? '#4caf50' : '#e94560',
      fillOpacity: 1,
    }).addTo(map).bindTooltip(isOrigin ? 'Origen' : 'Destino', { permanent: true, direction: 'top' });
    markers.push(marker);
    if (isOrigin) {
      $('originLat').value = e.latlng.lat.toFixed(5);
      $('originLon').value = e.latlng.lng.toFixed(5);
    } else {
      $('destLat').value = e.latlng.lat.toFixed(5);
      $('destLon').value = e.latlng.lng.toFixed(5);
    }
  });

  // ---- Importar área visible ----
  $('importar').addEventListener('click', async () => {
    const b = map.getBounds();
    const bbox = { south: b.getSouth(), west: b.getWest(), north: b.getNorth(), east: b.getEast() };
    const btn = $('importar');
    btn.disabled = true;
    $('importStatus').textContent = 'Importando calles de OSM... (10-60s)';
    $('importStatus').style.color = '#00b4d8';
    try {
      const res = await fetch(`${API}/import`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(bbox),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || res.statusText);
      $('importStatus').textContent = `${data.nodes} nodos, ${data.edges} aristas importados.`;
      $('importStatus').style.color = '#80ed99';
      // Dibujar el rectángulo importado para saber dónde hacer click.
      if (bboxLayer) map.removeLayer(bboxLayer);
      bboxLayer = L.rectangle(
        [[bbox.south, bbox.west], [bbox.north, bbox.east]],
        { color: '#00b4d8', weight: 1, dashArray: '5', fill: false }
      ).addTo(map);
    } catch (err) {
      $('importStatus').textContent = 'Error: ' + err.message;
      $('importStatus').style.color = '#e94560';
    } finally {
      btn.disabled = false;
    }
  });

  // ---- Aplica los valores de un preset a inputs y botones ----
  function applyPreset(profile) {
    const preset = PRESETS[profile];
    if (!preset) return;
    Object.entries(preset).forEach(([weight, value]) => {
      const input = document.querySelector(`input[data-weight="${weight}"]`);
      if (input) input.value = value;
      const span = $(VAL_SPANS[weight]);
      if (span) span.textContent = value;
    });
    // Reflejar en los grupos de botones (el botón más cercano al valor).
    highlightClosest('surfaceWeight', preset.surfaceWeight);
    highlightClosest('elevationWeight', preset.elevationWeight);
  }

  function highlightClosest(target, value) {
    const grid = document.querySelector(`.opt-grid[data-target="${target}"]`);
    if (!grid) return;
    let best = null, bestDiff = Infinity;
    grid.querySelectorAll('.opt-btn').forEach(b => {
      b.classList.remove('active');
      const diff = Math.abs(parseFloat(b.dataset.value) - value);
      if (diff < bestDiff) { bestDiff = diff; best = b; }
    });
    if (best) best.classList.add('active');
  }

  function deselectProfile() {
    document.querySelectorAll('.profile-btn').forEach(b => b.classList.remove('active'));
    selectedProfile = null;
  }

  // ---- Selección de perfil: carga sus valores predefinidos ----
  document.querySelectorAll('.profile-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.profile-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedProfile = btn.dataset.profile;
      applyPreset(selectedProfile);
    });
  });

  // ---- Botones de Tipo de camino / Desnivel: setean su peso oculto ----
  document.querySelectorAll('.opt-grid[data-target]').forEach(grid => {
    const target = grid.dataset.target;
    grid.querySelectorAll('.opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        grid.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const input = document.querySelector(`input[data-weight="${target}"]`);
        if (input) input.value = btn.dataset.value;
        deselectProfile(); // cambió un parámetro → ya no es un perfil puro
      });
    });
  });

  // ---- Slider de Sinuosidad: actualiza el valor y deselecciona el perfil ----
  document.querySelector('input[data-weight="curvinessWeight"]').addEventListener('input', (e) => {
    $('val-curviness').textContent = e.target.value;
    deselectProfile();
  });

  // ---- Botones de Vuelta (largo del viaje) ----
  document.querySelectorAll('#tripGroup .opt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#tripGroup .opt-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedTrip = btn.dataset.trip;
    });
  });

  // Sincronizar botones/slider con el perfil activo por defecto.
  applyPreset('moto-curvas');

  // ---- Calcular ----
  $('calcular').addEventListener('click', async () => {
    const btn = $('calcular');
    const errorEl = $('error');
    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Calculando...';

    routeLayers.forEach(l => map.removeLayer(l));
    routeLayers = [];
    $('stats').style.display = 'none';
    $('stats').innerHTML = '';

    const origin = { lat: parseFloat($('originLat').value), lon: parseFloat($('originLon').value) };
    const destination = { lat: parseFloat($('destLat').value), lon: parseFloat($('destLon').value) };

    try {
      // Etiqueta/color de la tarjeta: el perfil activo, o "Personalizado".
      const meta = selectedProfile
        ? PROFILES_META[selectedProfile]
        : { label: 'Personalizado', color: '#e94560', weight: 5 };
      const data = await calcRoute(origin, destination);
      renderRoute(data, meta.color, meta.weight);
      map.fitBounds(routeLayers[routeLayers.length - 1].getBounds(), { padding: [30, 30] });
      const statsEl = $('stats');
      statsEl.style.display = 'flex';
      statsEl.appendChild(buildProfileCard(meta, data.stats));
    } catch (e) {
      errorEl.textContent = e.message;
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Calcular ruta';
    }
  });

  // Lee los sliders y arma el objeto de pesos.
  function readWeights() {
    const weights = {};
    document.querySelectorAll('[data-weight]').forEach(input => {
      weights[input.dataset.weight] = parseFloat(input.value);
    });
    return weights;
  }

  async function calcRoute(origin, destination) {
    // Siempre mandamos los valores de los sliders como pesos custom.
    const body = {
      origin, destination, profile: 'custom',
      customWeights: readWeights(),
      tripLength: selectedTrip,
    };
    const res = await fetch(`${API}/routes/calculate`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      const msg = Array.isArray(err.message) ? err.message.join(', ') : err.message;
      throw new Error(msg || `HTTP ${res.status}`);
    }
    return res.json();
  }

  function renderRoute(data, color, weight) {
    // El backend devuelve coordinates como [lat, lon] — Leaflet las usa directo.
    const layer = L.polyline(data.coordinates, { color, weight, opacity: 0.85 }).addTo(map);
    routeLayers.push(layer);
  }

  function buildProfileCard(meta, stats) {
    const card = document.createElement('div');
    card.className = 'profile-result';
    card.style.borderLeftColor = meta.color;
    const total = stats.distanceMeters || 1;

    card.innerHTML = `
      <div class="pr-title" style="color:${meta.color}">${meta.label}</div>
      <div class="stat-row"><span class="stat-label">Distancia</span>
        <span class="stat-value" style="color:${meta.color}">${(stats.distanceMeters/1000).toFixed(2)} km</span></div>
      <div class="stat-row"><span class="stat-label">Sinuosidad</span>
        <span class="stat-value" style="color:${meta.color}">${(stats.curviness*100).toFixed(1)}%</span></div>
      <div class="stat-row"><span class="stat-label">Desnivel +</span>
        <span class="stat-value" style="color:${meta.color}">${stats.elevationGainMeters.toFixed(0)} m</span></div>
      <div class="stat-row"><span class="stat-label">Desnivel −</span>
        <span class="stat-value" style="color:${meta.color}">${stats.elevationLossMeters.toFixed(0)} m</span></div>
      <div class="bars-title">Tipo de vía</div>
      ${buildBars(stats.highwayBreakdown, HIGHWAY_COLORS, total)}
      <div class="bars-title">Superficie</div>
      ${buildBars(stats.surfaceBreakdown, SURFACE_COLORS, total)}
    `;
    return card;
  }

  function buildBars(breakdown, colors, total) {
    if (!breakdown || Object.keys(breakdown).length === 0) return '<div class="hint">sin datos</div>';
    return Object.entries(breakdown)
      .sort((a, b) => b[1] - a[1])
      .map(([key, meters]) => {
        const pct = ((meters / total) * 100).toFixed(0);
        const color = colors[key] || '#888';
        return `<div class="breakdown-bar">
          <span class="bar-label">${key}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
          <span class="bar-pct">${pct}%</span>
        </div>`;
      }).join('');
  }
</script>
</body>
</html>
